<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harness · Features 목업</title>
  <style>
    :root{--paper:#faf8f4;--white:#fffefa;--nav:#f2f1eb;--ink:#18211d;--muted:#68716b;--forest:#123d2d;--green:#37986a;--line:#d7d8d0;--violet:#6047b8;--amber:#be851e;--red:#a63b32;--gray:#aab0aa}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-columns:254px minmax(0,1fr)}.nav{position:sticky;top:0;height:100vh;background:var(--nav);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 27px}.brand-mark{width:39px;height:39px;border-radius:10px;background:var(--forest);color:white;display:grid;place-items:center;font-size:22px;font-weight:800}.brand-title{font-size:20px;font-weight:750;line-height:1.1;color:var(--forest)}.brand-sub{font-size:9px;letter-spacing:.15em;color:var(--muted);font-weight:750}.nav-list{display:grid;gap:4px}.nav-item{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:8px;color:#52605a;width:100%}.nav-item.active{background:#e0e8e0;color:var(--forest);font-weight:700;border-right:3px solid var(--forest)}.nav-icon{width:18px;text-align:center;font-size:17px}.nav-foot{margin-top:auto;border-top:1px solid var(--line);padding:17px 11px 0;color:var(--muted);font-size:12px}.live-dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:7px}
    .main{min-width:0}.head{height:135px;padding:22px 32px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end}.crumb,.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;color:#708078}.crumb{margin-bottom:13px}.head h1{font-size:32px;color:var(--forest);line-height:1;margin:0;letter-spacing:-.035em}.head h1 small{font:400 12px/1.5 sans-serif;color:#7e8982;margin-left:11px;letter-spacing:0}.primary{background:var(--forest);color:white;border:1px solid var(--forest);border-radius:7px;padding:10px 17px;font-weight:700}.content{padding:24px 32px 55px;max-width:1700px;margin:auto}.intro{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.intro h2{font-size:13px;letter-spacing:.13em;color:var(--forest);margin:0 0 3px}.intro p{margin:0;color:var(--muted);font-size:12px}.ghost{border:1px solid var(--line);border-radius:7px;padding:8px 12px;color:#495951;background:var(--white)}.toolbar{display:flex;align-items:center;gap:10px;background:#f1f0f8;border:1px solid #e6e2ee;border-radius:10px;padding:11px 13px;margin-bottom:20px;flex-wrap:wrap}.search{min-width:210px;width:275px;max-width:100%;background:white;border:1px solid transparent;border-radius:6px;padding:9px 11px;outline:none}.search:focus{border-color:var(--forest)}.status-filter{border:1px solid #e7e7e1;background:white;border-radius:6px;padding:9px 10px;color:#3c4c43}.view-tab{margin-left:auto;display:flex;border-radius:7px;background:#e8e8e2;padding:3px}.view-tab span{padding:5px 10px;color:#87918a}.view-tab .selected{background:white;color:var(--forest);border-radius:5px;box-shadow:0 1px 3px #0001}.count{color:#67756b;font-size:12px;margin-left:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card{border:1px solid var(--line);border-radius:10px;background:var(--white);padding:18px 19px 17px;text-align:left;min-height:167px;display:flex;flex-direction:column;transition:box-shadow .18s,border-color .18s,transform .18s}.card:hover,.card:focus-visible{border-color:#8bb6a1;box-shadow:0 8px 26px #123d2d13;transform:translateY(-1px);outline:none}.card-top{display:flex;justify-content:space-between;align-items:start;gap:10px}.card-title{font-size:17px;font-weight:740;line-height:1.35;letter-spacing:-.02em}.card-id{font-size:10px;color:#8a958d;margin-top:3px}.card-more{color:#829088;font-size:19px;line-height:1}.card-mid{display:flex;align-items:center;justify-content:space-between;margin-top:16px;color:#606f66;font-size:12px}.card-mid strong{font-weight:700;color:var(--forest)}.bar{height:10px;border-radius:4px;background:#e8eae5;display:flex;overflow:hidden;margin-top:15px;width:100%}.bar .seg{height:100%}.done{background:var(--green)}.progress{background:var(--amber)}.ready{background:#7b8490}.backlog{background:#bbc0ba}.blocked{background:var(--red)}.bar.empty{border:1px dashed #c6ccc5;background:#f5f6f3;height:10px}.card-bottom{margin-top:auto;padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{font-size:11px;border-radius:5px;padding:4px 8px;border:1px solid var(--line);color:#56645c;background:#fbfbf9;white-space:nowrap}.pill.active{color:#856017;border-color:#ead9ae;background:#fbf2db}.pill.planned{color:#686e69}.pill.completed{color:#287451;border-color:#b9dcc9;background:#e9f5ed}.pill.paused{color:#7455a3;border-color:#ded2f1;background:#f5efff}.priority{font-size:11px;color:#7d8a82}.empty-note{font-size:11px;color:#8b958d}.footer{height:32px;background:var(--forest);color:#deeee3;font-size:11px;padding:7px 20px;position:fixed;bottom:0;left:254px;right:0;z-index:2}.mock-label{margin-left:10px;opacity:.7}
    .scrim{position:fixed;inset:0;background:rgba(13,28,20,.22);z-index:4;display:none}.scrim.open{display:block}.detail{position:fixed;right:0;top:0;bottom:0;width:min(550px,100vw);background:var(--white);border-left:1px solid var(--line);box-shadow:-20px 0 50px #132c1d22;z-index:5;transform:translateX(105%);transition:transform .22s ease;overflow:auto}.detail.open{transform:translateX(0)}.detail-head{padding:30px 32px 23px;border-bottom:1px solid var(--line)}.detail-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.detail-kicker{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--forest)}.close{width:30px;height:30px;background:transparent;border:0;font-size:24px;color:#69766e}.detail h2{font-size:27px;line-height:1.25;letter-spacing:-.035em;margin:0 0 12px;color:var(--forest)}.detail-goal{color:#4f5e55;line-height:1.65;margin:0}.detail-body{padding:8px 32px 34px}.section{padding:23px 0;border-bottom:1px solid var(--line)}.section h3{margin:0 0 17px;font-size:14px;color:#2a3d31}.properties{display:grid;grid-template-columns:110px 1fr;gap:13px 14px;font-size:13px}.properties .key{color:#7c8980}.metric{display:flex;align-items:baseline;gap:11px;margin:12px 0 4px}.metric strong{font-size:30px;line-height:1;color:var(--forest)}.metric span{color:#6c796f;font-size:12px}.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}.legend div{font-size:12px;color:#56645b}.swatch{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.wi-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:7px;padding:11px 12px;margin-top:8px}.wi-row b{font-size:12px;font-weight:650}.wi-row small{display:block;color:#869187;margin-top:3px;font-size:10px}.wi-status{font-size:10px;font-weight:750;color:#64786a;white-space:nowrap}.wi-status.done-text{color:var(--green)}.wi-status.progress-text{color:var(--amber)}.no-wi{border:1px dashed #c8d1c9;border-radius:10px;background:#f8faf7;padding:26px;text-align:center;color:#647269}.no-wi .symbol{font-size:28px;color:#a4afa5}.no-wi b{display:block;color:#3d5545;margin:5px 0}.detail-link{display:inline-block;margin-top:17px;color:var(--forest);font-size:12px;font-weight:700;text-decoration:none}.detail-link:hover{text-decoration:underline}.seg[title]{cursor:help}
    @media(max-width:1000px){.grid{grid-template-columns:1fr}.shell{grid-template-columns:190px 1fr}.footer{left:190px}.nav{padding-inline:10px}.head,.content{padding-left:23px;padding-right:23px}}@media(max-width:650px){.shell{grid-template-columns:1fr}.nav{display:none}.footer{left:0}.head{height:auto;padding:22px}.head h1{font-size:27px}.content{padding:20px 16px 55px}.search{width:100%}.view-tab{display:none}.grid{gap:11px}.card{min-height:150px}.detail-head,.detail-body{padding-left:22px;padding-right:22px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <div class="brand"><div class="brand-mark">H</div><div><div class="brand-title">Harness_v2</div><div class="brand-sub">AI ORCHESTRATION<br>WORKSPACE</div></div></div>
      <nav class="nav-list" aria-label="메뉴"><button class="nav-item"><span class="nav-icon">◫</span>Overview</button><button class="nav-item active"><span class="nav-icon">◇</span>Features</button><button class="nav-item"><span class="nav-icon">≡</span>Work Items</button><button class="nav-item"><span class="nav-icon">▷</span>Runs</button><button class="nav-item"><span class="nav-icon">⌘</span>MemoryGraph</button><button class="nav-item"><span class="nav-icon">◷</span>Activity Timeline</button></nav>
      <div class="nav-foot"><span class="live-dot"></span>State DB 연결됨<br><small>LOCAL WORKSPACE</small></div>
    </aside>
    <main class="main"><header class="head"><div><div class="crumb">MAIN &nbsp;/&nbsp; FEATURES</div><div class="eyebrow" style="margin-bottom:7px">PROJECT CONTROL</div><h1>Features <small id="featureCount"></small></h1></div><button class="primary" type="button" title="목업에서는 기능을 실행하지 않습니다">+ 새 Feature</button></header>
      <div class="content"><div class="intro"><div><h2>FEATURE GALLERY</h2><p>기능별 작업 진행 상황을 한눈에 살펴보세요. 카드를 누르면 상세 정보가 열립니다.</p></div><button class="ghost" type="button" id="reset">↻ 새로고침</button></div>
        <div class="toolbar"><input class="search" id="search" placeholder="Feature 제목·ID 검색" aria-label="Feature 검색"><select class="status-filter" id="status" aria-label="상태 필터"><option value="all">전체 상태</option><option value="planned">Planned</option><option value="active">Active</option><option value="paused">Paused</option><option value="completed">Completed</option></select><span class="count" id="visibleCount"></span><div class="view-tab" aria-label="갤러리 보기"><span>☰</span><span class="selected">▦</span></div></div>
        <div class="grid" id="cards"></div>
      </div>
    </main>
  </div>
  <footer class="footer"><span class="live-dot"></span>Control Center <span class="mock-label">FEATURE UI MOCKUP · 예시 데이터</span></footer>
  <div class="scrim" id="scrim"></div><aside class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Feature 상세 정보"></aside>
  <script>
    const features=[
      {id:'FEAT-8c12a9',title:'사용자 계정과 데이터 분리',goal:'사용자가 로그인하고 자신의 연결 계정·문서·분석 결과만 이용할 수 있다.',status:'active',priority:'High',wi:[['회원가입과 로그인','done'],['사용자별 연결 권한·문서·분석 결과 분리','in_progress'],['계정 연결 오류 처리','ready'],['접근 제어 검증','backlog']]},
      {id:'FEAT-370e4b',title:'Google Docs 원본 연결·선택',goal:'Google Docs 원본을 찾아 내용을 분석에 활용할 수 있다.',status:'active',priority:'High',wi:[['Google Docs 계정 연결','done'],['접근 가능한 문서 목록 조회','done'],['분석 대상 문서 선택','ready']]},
      {id:'FEAT-79b6dd',title:'문서 분석과 결과 제공',goal:'선택한 원본에서 필요한 정보를 추출하고 확인 가능한 분석 결과를 제공한다.',status:'planned',priority:'Normal',wi:[['문서 분석 파이프라인','backlog'],['분석 결과 화면','backlog'],['오류 및 재시도 흐름','blocked'],['분석 품질 검증','ready']]},
      {id:'FEAT-d839e1',title:'분석 결과 공유',goal:'분석 결과를 프로젝트 구성원과 안전하게 공유한다.',status:'planned',priority:'Normal',wi:[]},
      {id:'FEAT-67f02a',title:'초기 사용자 흐름',goal:'신규 사용자가 계정 연결부터 첫 분석까지 무리 없이 마칠 수 있다.',status:'paused',priority:'Low',wi:[['연결 안내','done'],['첫 분석 가이드','in_progress'],['온보딩 문구 수정','ready']]},
      {id:'FEAT-25a17c',title:'기본 설정과 작업 환경',goal:'사용자가 작업 환경을 설정하고 필요할 때 다시 변경할 수 있다.',status:'completed',priority:'Normal',wi:[['기본 설정 저장','done'],['설정 변경 화면','done'],['설정 초기화','done']]}
    ];
    const statusLabel={planned:'Planned',active:'Active',paused:'Paused',completed:'Completed',cancelled:'Cancelled'};
    const wiLabel={done:'Done',in_progress:'In Progress',ready:'Ready',backlog:'Backlog',blocked:'Blocked',cancelled:'Cancelled'};
    const wiClass={done:'done',in_progress:'progress',ready:'ready',backlog:'backlog',blocked:'blocked'};
    const order=['done','in_progress','ready','backlog','blocked'];
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const stats=f=>{const counts=Object.fromEntries(['done','in_progress','ready','backlog','blocked','cancelled'].map(k=>[k,f.wi.filter(w=>w[1]===k).length]));return{counts,eligible:f.wi.length-counts.cancelled}};
    function bar(f){let{counts,eligible}=stats(f);if(!eligible)return '<div class="bar empty" aria-label="진행률 계산 전"></div>';return '<div class="bar" aria-label="완료 '+counts.done+' / '+eligible+'">'+order.map(k=>counts[k]?'<span class="seg '+wiClass[k]+'" style="width:'+(counts[k]/eligible*100)+'%" title="'+wiLabel[k]+' '+counts[k]+'개"></span>':'').join('')+'</div>'}
    function render(){const query=document.getElementById('search').value.trim().toLowerCase(),filter=document.getElementById('status').value;const shown=features.filter(f=>(filter==='all'||f.status===filter)&&(!query||(f.title+' '+f.id).toLowerCase().includes(query)));document.getElementById('featureCount').textContent=features.length+' total';document.getElementById('visibleCount').textContent=shown.length+'개 표시';document.getElementById('cards').innerHTML=shown.length?shown.map(f=>{let{counts,eligible}=stats(f);return '<button class="card" type="button" data-id="'+f.id+'"><div class="card-top"><div><div class="card-title">'+esc(f.title)+'</div><div class="card-id">'+f.id+'</div></div><span class="card-more">↗</span></div><div class="card-mid"><span>▱ &nbsp;'+(eligible?'<strong>'+counts.done+' / '+eligible+'</strong> WI 완료':'<strong>WI 없음</strong>')+'</span><span>'+ (eligible?Math.round(counts.done/eligible*100)+'%':'진행률 계산 전')+'</span></div>'+bar(f)+'<div class="card-bottom"><span class="pill '+f.status+'">'+statusLabel[f.status]+'</span><span class="priority">'+f.priority+' priority</span></div></button>'}).join(''):'<p style="color:#68716b">검색 결과가 없습니다.</p>'}
    function openDetail(id){const f=features.find(x=>x.id===id);if(!f)return;let{counts,eligible}=stats(f),pct=eligible?Math.round(counts.done/eligible*100):null;document.getElementById('detail').innerHTML='<div class="detail-head"><div class="detail-actions"><span class="detail-kicker">FEATURE &nbsp;·&nbsp; '+f.id+'</span><button class="close" id="close" aria-label="닫기">×</button></div><h2>'+esc(f.title)+'</h2><p class="detail-goal">'+esc(f.goal)+'</p></div><div class="detail-body"><section class="section"><h3>속성</h3><div class="properties"><span class="key">상태</span><span><span class="pill '+f.status+'">'+statusLabel[f.status]+'</span></span><span class="key">우선순위</span><span>'+f.priority+'</span><span class="key">연결된 WI</span><span>'+f.wi.length+'개</span></div></section><section class="section"><h3>진행 상황</h3><div class="metric"><strong>'+(pct===null?'—':pct+'%')+'</strong><span>'+(pct===null?'진행률 계산 전 · 대상 WI 없음':counts.done+' / '+eligible+' WI 완료')+'</span></div>'+bar(f)+(eligible?'<div class="legend">'+order.map(k=>'<div><span class="swatch '+wiClass[k]+'"></span>'+wiLabel[k]+' &nbsp;<b>'+counts[k]+'</b></div>').join('')+(counts.cancelled?'<div>Cancelled &nbsp;<b>'+counts.cancelled+'</b> <small>(계산 제외)</small></div>':'')+'</div>':'<p class="empty-note">WI를 연결하면 진행률이 표시됩니다. Feature 상태는 별도로 관리됩니다.</p>')+'</section><section class="section"><h3>연결된 Work Items <span style="color:#829088;font-weight:400">'+f.wi.length+'</span></h3>'+(f.wi.length?f.wi.map((w,i)=>'<div class="wi-row"><div><b>'+esc(w[0])+'</b><small>WI-예시-'+String(i+1).padStart(2,'0')+'</small></div><span class="wi-status '+(w[1]==='done'?'done-text':w[1]==='in_progress'?'progress-text':'')+'">'+wiLabel[w[1]]+'</span></div>').join(''):'<div class="no-wi"><div class="symbol">◇</div><b>아직 연결된 WI가 없습니다</b><span>작업 항목을 연결하면 이곳에 목록과 진행 상황이 표시됩니다.</span></div>')+'<a class="detail-link" href="#" id="wiLink">Work Items에서 보기 →</a></section></div>';document.getElementById('scrim').classList.add('open');document.getElementById('detail').classList.add('open');document.getElementById('close').onclick=closeDetail;document.getElementById('wiLink').onclick=e=>e.preventDefault()}
    function closeDetail(){document.getElementById('scrim').classList.remove('open');document.getElementById('detail').classList.remove('open')}
    document.getElementById('cards').addEventListener('click',e=>{const card=e.target.closest('[data-id]');if(card)openDetail(card.dataset.id)});document.getElementById('search').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);document.getElementById('reset').onclick=()=>{document.getElementById('search').value='';document.getElementById('status').value='all';render()};document.getElementById('scrim').onclick=closeDetail;window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});render();
  </script>
</body>
</html>
